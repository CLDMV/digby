<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<!-- CSP allows 'unsafe-inline' for the boot script + the importmap bootHost injects at runtime. -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
	<title>Digby</title>
	<!-- One generated stylesheet: tokens + base + every co-located primitive/builtin
	     CSS + shell, concatenated by `@cldmv/rummage` styles. Run `npx rummage styles`
	     (or it's regenerated by `rummage build`) to refresh it. -->
	<link rel="stylesheet" href="../node_modules/@cldmv/rummage/src/styles/rummage.generated.css" />
	<!--
	  NO static importmap. rummage SUPPLIES the complete map — slothlet's modules +
	  the api leaf URLs + rummage's own browser deps (@cldmv/rummage/launch + /browser +
	  the vendored deps + the pre-bundled drizzle surface) — and the boot script below injects
	  it before the app imports anything. This is the SAME pattern every served target
	  uses (rummage run / rummage build generate an equivalent boot index), so the
	  app file is byte-identical across desktop/web/mobile.

	  NOTE: `npm start` runs `rummage run` — it builds a self-contained bundle and the
	  loopback responder serves THAT (with its own generated index.html). This source
	  index.html is only loaded by the `start:ipc` break-glass (electron . --ipc),
	  which serves it from disk with the preload bridge installed. Add your feature
	  extensions' renderer entries via the lazy "app" form in rummage.config.mjs (not
	  here) so they're imported only in a web view.
	-->
</head>
<body>
	<div id="shell-root"></div>
	<div id="app-tooltip"></div>
	<!-- Static text below uses data-i18n-key so connectExtHost's i18n
	     bootstrap localises it before it's shown (see context.i18n.applyDom). -->
	<div id="notify-panel" class="notify-panel" role="dialog" data-i18n-attrs='{"aria-label":"host.ext.notify.displayName"}' aria-label="Notifications">
		<div class="notify-panel-header">
			<span class="notify-panel-title" data-i18n-key="host.ext.notify.displayName">Notifications</span>
			<button id="notify-panel-clear-btn" class="btn btn-secondary btn-small" type="button" data-i18n-key="host.ext.notify.commands.dismissAll">Clear all</button>
		</div>
		<div id="notify-panel-list" class="notify-panel-list">
			<div class="notify-panel-empty" data-i18n-key="host.ext.notify.panel.empty">No notifications</div>
		</div>
	</div>
	<div id="notify-toast-container" class="notify-toast-container" aria-live="polite"></div>

	<!-- Modal templates (the modal extension renders into these by id) -->
	<div id="confirmModal" class="modal">
		<div class="modal-content modal-small">
			<div class="modal-header"><h2 id="confirmModalTitle" data-i18n-key="host.ext.modal.confirm.defaultTitle">Confirm</h2></div>
			<div class="modal-body"><p id="confirmModalMessage" style="margin:0;line-height:1.5"></p></div>
			<div class="modal-footer">
				<button class="btn btn-secondary" id="confirmModalCancelBtn" data-i18n-key="host.ui.button.cancel">Cancel</button>
				<!-- confirmModalConfirmBtn label is overwritten per-call by modal.confirm({confirmLabel}). -->
				<button class="btn btn-danger" id="confirmModalConfirmBtn">Confirm</button>
			</div>
		</div>
	</div>
	<div id="errorModal" class="modal">
		<div class="modal-content modal-small">
			<div class="modal-header error-header"><h2 data-i18n-key="host.ext.modal.error.defaultTitle">Error</h2></div>
			<div class="modal-body"><div class="error-message" id="errorMessage"></div></div>
			<div class="modal-footer"><button class="btn btn-secondary" data-close data-i18n-key="host.ui.button.close">Close</button></div>
		</div>
	</div>
	<div id="infoModal" class="modal">
		<div class="modal-content modal-small">
			<div class="modal-header">
				<h2 id="infoModalTitle" data-i18n-key="host.ext.modal.info.defaultTitle">Info</h2>
				<button class="modal-close" data-close data-i18n-attrs='{"data-tooltip":"host.ui.button.close","aria-label":"host.ui.button.close"}' data-tooltip="Close" aria-label="Close">&times;</button>
			</div>
			<div class="modal-body"><p id="infoModalMessage" style="margin:0;line-height:1.5;white-space:pre-wrap;"></p></div>
			<div class="modal-footer"><button class="btn btn-primary" data-close data-i18n-key="host.ui.button.ok">OK</button></div>
		</div>
	</div>
	<div id="promptModal" class="modal">
		<div class="modal-content modal-small">
			<div class="modal-header">
				<h2 id="promptModalTitle" data-i18n-key="host.ext.modal.prompt.defaultTitle">Rename</h2>
				<button class="modal-close" data-close data-i18n-attrs='{"data-tooltip":"host.ui.button.close","aria-label":"host.ui.button.close"}' data-tooltip="Close" aria-label="Close">&times;</button>
			</div>
			<div class="modal-body">
				<div class="form-group">
					<label id="promptModalLabel" for="promptModalInput" data-i18n-key="host.ext.modal.prompt.defaultLabel">Name</label>
					<input type="text" id="promptModalInput" />
				</div>
			</div>
			<div class="modal-footer">
				<button class="btn btn-secondary" id="promptModalCancelBtn" data-i18n-key="host.ui.button.cancel">Cancel</button>
				<!-- promptModalConfirmBtn label is overwritten per-call by modal.prompt({confirmLabel}). -->
				<button class="btn btn-primary" id="promptModalConfirmBtn">OK</button>
			</div>
		</div>
	</div>
	<!--
	  Boot — the SAME entry point every platform runs. bootHost() installs window.host
	  over the auto-detected transport (the desktop preload injects __rummageBridge →
	  Electron IPC; web/mobile detect their own) and injects rummage's generated
	  importmap BEFORE the app imports anything, so app.mjs's bare
	  `import "@cldmv/rummage/launch"` (+ slothlet inside @cldmv/rummage/browser) resolve.
	  bootHost is reached by a file://-relative path here because this source file is
	  loaded via loadFile; the served targets (rummage run/build) ship a generated
	  index.html that imports "@cldmv/rummage/boot" through the importmap instead — same
	  bootHost, the app file is byte-identical across platforms.
	-->
	<script>
		(async () => {
			try {
				const { bootHost } = await import("../node_modules/@cldmv/rummage/src/contract/boot.mjs");
				await bootHost();
			} catch (err) {
				console.error("[digby] boot failed:", err);
			}
			await import("./app.mjs");
		})();
	</script>
</body>
</html>
